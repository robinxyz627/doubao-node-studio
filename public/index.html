<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豆包视频画布</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/extras.css"><link rel="stylesheet" href="/aesthetic.css"><link rel="stylesheet" href="/motion.css"><link rel="stylesheet" href="/minimal.css"><link rel="stylesheet" href="/details.css"><link rel="stylesheet" href="/popover.css"><link rel="stylesheet" href="/stability.css"><link rel="stylesheet" href="/ui-fix.css"><link rel="stylesheet" href="/aspect-motion.css"><link rel="stylesheet" href="/library-dialog.css"><link rel="stylesheet" href="/visibility.css"><link rel="stylesheet" href="/text-mentions.css"><link rel="stylesheet" href="/line-breaks.css"><link rel="stylesheet" href="/duration.css"><link rel="stylesheet" href="/video-history.css"><link rel="stylesheet" href="/accounts.css"><link rel="stylesheet" href="/canvas-interactions.css"></head>
<body>
  <header class="topbar">
    <div class="brand"><span class="eyebrow">DOUBAO LOCAL CANVAS</span><strong>豆包视频画布</strong></div>
    <div class="workspace-control"><span>工作区</span><select id="workspace-select"></select><input id="workspace-name" maxlength="60" placeholder="工作区名称"><button id="rename-workspace" class="ghost">改名</button><button id="new-workspace" class="ghost">＋ 新建</button></div>
    <div class="top-actions"><button id="toggle-assets" class="ghost">项目素材</button><button id="toggle-library" class="ghost">用户素材库</button><button id="toggle-history" class="ghost">任务</button><button id="toggle-accounts" class="ghost">账号</button><button id="fit-view" class="ghost">适配</button><button id="bridge-connect" class="ghost">连接</button><span class="connection"><i id="bridge-dot"></i><span id="bridge-state">本地服务连接中…</span></span></div>
  </header>
  <main id="graph-viewport" class="graph-viewport">
    <div id="graph-world" class="graph-world"><svg id="graph-edges" class="graph-edges" width="4000" height="2400" viewBox="0 0 4000 2400"></svg><div id="node-layer" class="node-layer"></div><section id="video-popover" class="video-popover" hidden></section></div>
    <div class="canvas-tip">右键创建节点 · 中键拖动画布 · Ctrl + 滚轮缩放 · 拖图片文件到此处</div>
    <div class="canvas-zoom"><button id="zoom-out" class="ghost">−</button><span id="zoom-label">100%</span><button id="zoom-in" class="ghost">＋</button></div>
    <div id="context-menu" class="context-menu" hidden><button data-create="image">▣ 创建图片节点</button><button data-create="text">T 创建文本节点</button><button data-create="video">▶ 创建视频节点</button></div><div id="node-menu" class="context-menu" hidden><button data-library-category="人物">存入素材库：人物</button><button data-library-category="环境">存入素材库：环境</button><button data-library-category="物品">存入素材库：物品</button><button data-library-category="风格">存入素材库：风格</button></div>
  </main>
  <aside id="asset-drawer" class="drawer asset-drawer" hidden><div class="drawer-head"><div><span class="eyebrow">MEDIA BIN</span><strong>工作区素材</strong></div><button class="close-drawer ghost" data-close="asset-drawer">×</button></div><label class="upload-drop" for="asset-input"><input id="asset-input" type="file" accept=".jpg,.jpeg,.png,.webp" multiple hidden><b>上传图片</b><small>或直接拖入画布</small></label><div id="asset-list" class="asset-list"></div></aside>
  <aside id="library-drawer" class="drawer library-drawer" hidden><div class="drawer-head"><div><span class="eyebrow">USER LIBRARY</span><strong>跨项目用户素材库</strong></div><button class="close-drawer ghost" data-close="library-drawer">×</button></div><p id="library-path" class="drawer-note"></p><div id="library-list" class="library-list"></div></aside>
  <aside id="history-drawer" class="drawer history-drawer" hidden><div class="drawer-head"><div><span class="eyebrow">TASK HISTORY</span><strong>任务与状态</strong></div><div><button id="clear-jobs" class="ghost">清空</button><button class="close-drawer ghost" data-close="history-drawer">×</button></div></div><div id="job-list" class="job-list"><p class="empty">本工作区还没有任务。</p></div></aside>
  <aside id="account-drawer" class="drawer account-drawer" hidden><div class="drawer-head"><div><span class="eyebrow">ACCOUNT CONTAINERS</span><strong>豆包账号</strong></div><button class="close-drawer ghost" data-close="account-drawer">×</button></div><p class="drawer-note">每个账号使用独立 Chrome 登录容器。首次添加会打开一个窗口供你登录，之后登录态会保存在本机。</p><div id="account-list" class="account-list"></div><button id="add-account" class="add-account">＋ 添加账号</button></aside>
  <div id="library-save-dialog" class="library-save-dialog" hidden><section><h3>存入用户素材库</h3><label>分类<select id="library-save-category"><option>人物</option><option>环境</option><option>物品</option><option>风格</option></select></label><label>素材名称<input id="library-save-name" maxlength="80"></label><label>子文件夹（可选，例如角色名）<input id="library-save-folder" maxlength="60" placeholder="小碧窥天"></label><div><button id="library-save-cancel" class="ghost">取消</button><button id="library-save-confirm" class="ghost">存入素材库</button></div></section></div>
  <div id="bridge-dialog" class="library-save-dialog" hidden><section><h3>连接豆包桥接扩展</h3><p class="bridge-dialog-note">在 Chrome 扩展弹窗中填入以下地址与密钥。密钥只用于本机扩展领取本机任务。</p><label>工作台地址<input id="bridge-origin" readonly value="http://127.0.0.1:4318"></label><label>配对密钥<input id="bridge-key" readonly></label><div><button id="bridge-close" class="ghost">关闭</button><button id="bridge-copy-key" class="ghost">复制密钥</button></div></section></div>
  <div id="text-mention-picker" class="text-mention-picker" hidden></div>
  <input id="node-file-input" type="file" accept=".jpg,.jpeg,.png,.webp" hidden>
  <template id="asset-template"><button class="asset-card"><img><span class="asset-name"></span><span class="asset-description"></span></button></template>
  <script src="/app.js"></script><script src="/fixups.js"></script><script src="/canvas-interactions.js"></script>
</body></html>
